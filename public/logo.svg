<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c2145" />
      <stop offset="100%" stop-color="#c85f37" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000" flood-opacity="0.2" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)" />
  <g filter="url(#shadow)">
    <rect x="120" y="120" width="150" height="150" rx="30" fill="#6dd0ff" />
    <rect x="242" y="222" width="150" height="150" rx="30" fill="#1f79d1" />
  </g>
</svg>

